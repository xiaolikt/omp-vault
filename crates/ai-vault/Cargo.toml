[package]
name = "ai-vault"
version = "0.5.0"
edition = "2021"
description = "Machine-wide encrypted secret store shared by AI coding agents"
license = "MIT"
repository = "https://github.com/xiaolikt/ai-vault"

[[bin]]
name = "ai-vault"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
