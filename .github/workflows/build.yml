name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binary:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aarch64 Linux links against the cross toolchain; everything else is native.
      - name: cross linker (linux arm64)
        if: matrix.pkg == 'linux-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build
        # The linker for the cross target has to be set where cargo runs.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --locked

      # The one platform the author does not develop on: the Rust unit tests
      # and the suite that starts the real exe, PowerShell, bash and (when
      # installed) bw there. `publish` needs this job, so a red test blocks a release.
      - name: test (Windows)
        if: matrix.pkg == 'win32-x64'
        run: |
          cargo test --release --locked
          npm install --no-audit --no-fund
          node --import tsx --test tests/windows.test.mjs

      - name: stage the npm platform package
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.pkg }}" == win32-* ]] && ext=".exe"
          bash scripts/stage-npm.sh "${{ matrix.pkg }}" --from "target/${{ matrix.target }}/release/ai-vault${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.pkg }}
          path: npm/${{ matrix.pkg }}

  publish:
    # Needs NPM_TOKEN in the repository secrets: an npm granular token with
    # "bypass 2FA" for publishing.
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: npm-artifacts

      - name: publish every platform package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm-artifacts/*/; do
            (cd "$dir" && npm publish --access public --provenance=false)
          done

      - name: publish the dispatcher and the extension
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
          (cd packages/pi-ai-vault && npm publish)
