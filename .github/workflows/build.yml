name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binary:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aarch64 Linux links against the cross toolchain; everything else is native.
      - name: cross linker (linux arm64)
        if: matrix.pkg == 'linux-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build
        # The linker for the cross target has to be set where cargo runs.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --locked

      # The one platform the author does not develop on: the Rust unit tests
      # and the suite that starts the real exe, PowerShell, bash and (when
      # installed) bw there. `publish` needs this job, so a red test blocks a release.
      - name: test (Windows)
        if: matrix.pkg == 'win32-x64'
        run: |
          cargo test --release --locked
          npm install --no-audit --no-fund
          node --import tsx --test tests/windows.test.mjs

      - name: stage the npm platform package
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.pkg }}" == win32-* ]] && ext=".exe"
          bash scripts/stage-npm.sh "${{ matrix.pkg }}" --from "target/${{ matrix.target }}/release/ai-vault${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.pkg }}
          path: npm/${{ matrix.pkg }}

  # Publishing stays local: `npm publish` needs the bypass-2FA granular token,
  # which has no business in a repository secret. This workflow builds every
  # platform — darwin can only be built here — and hands the staged npm
  # packages over as artifacts; the release is:
  #
  #   gh run download <run> -D npm-artifacts
  #   for d in npm-artifacts/*/; do (cd "$d" && npm publish --access public); done
  #   npm publish --access public && (cd packages/pi-ai-vault && npm publish)
